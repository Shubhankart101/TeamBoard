name: Template - Code Deployment (Docker & Azure App Service)

on:
  workflow_call:
    inputs:
      acr-name:
        description: 'Azure Container Registry name'
        required: false
        type: string
        default: 'acrteamboarddev'
      webapp-name:
        description: 'Azure Web App name'
        required: false
        type: string
        default: 'app-teamboard-dev'
      app-name:
        description: 'Application name'
        required: false
        type: string
        default: 'teamboard'
    secrets:
      AZURE_CREDENTIALS:
        required: true

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Azure Web App
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ inputs.acr-name }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ inputs.acr-name }}.azurecr.io/${{ inputs.app-name }}:${{ github.sha }}
          IMAGE_LATEST=${{ inputs.acr-name }}.azurecr.io/${{ inputs.app-name }}:latest
          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ inputs.webapp-name }}
          images: ${{ inputs.acr-name }}.azurecr.io/${{ inputs.app-name }}:latest

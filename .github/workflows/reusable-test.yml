name: Reusable Template - Code Testing

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      test-build-docker:
        description: 'Whether to test Docker container build'
        required: false
        type: boolean
        default: false
      artifact-name:
        description: 'Coverage artifact name'
        required: false
        type: string
        default: 'coverage-report'

jobs:
  run-tests:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Migrations
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest Suite & Coverage
        env:
          USE_SQLITE: "True"
        run: |
          pytest --cov=api --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Test Docker Container Build
        if: ${{ inputs.test-build-docker }}
        run: |
          docker build -t teamboard-test-build:latest .

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: coverage.xml

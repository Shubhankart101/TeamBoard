name: Pipeline - PR Validation (Pre-Merge Quality Gate)

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  pr-validation:
    name: Validate PR & Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Migrations
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest Suite & Coverage
        env:
          USE_SQLITE: "True"
        run: |
          pytest --cov=api --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Test Docker Container Build
        run: |
          docker build -t teamboard-test-build:latest .

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-report
          path: coverage.xml

name: Pipeline - PR Validation (Pre-Merge Quality Gate)

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  pr-validation:
    name: Invoke PR Validation Template
    uses: ./.github/workflows/templates/template-test.yml
    with:
      python-version: '3.11'
      test-build-docker: true
      artifact-name: 'pr-coverage-report'

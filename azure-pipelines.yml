name: TeamBoard-Master-CI-CD-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master

variables:
  azureServiceConnection: 'Azure-Subscription-ServiceConnection'
  containerRegistryName: 'acrteamboarddev'
  webAppName: 'app-teamboard-dev'
  appName: 'teamboard'
  pythonVersion: '3.11'
  workingDirectory: 'infrastructure'

stages:
  - stage: Test
    displayName: 'Automated Testing Pipeline Stage'
    jobs:
      - job: RunTests
        displayName: 'Run Pytest & Coverage'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/test-steps-template.yml
            parameters:
              pythonVersion: '$(pythonVersion)'
              testRunTitle: 'Master Pipeline Automated Tests'

  - stage: Infrastructure
    displayName: 'Infrastructure Pipeline Stage'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ProvisionTerraform
        displayName: 'Deploy Azure Infrastructure via Terraform'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/terraform-steps-template.yml
            parameters:
              azureServiceConnection: '$(azureServiceConnection)'
              workingDirectory: '$(workingDirectory)'

  - stage: BuildAndDeploy
    displayName: 'Code Deployment Pipeline Stage'
    dependsOn: Infrastructure
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildContainerAndDeploy
        displayName: 'Build Docker Image & Update Web App'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/docker-deploy-steps-template.yml
            parameters:
              azureServiceConnection: '$(azureServiceConnection)'
              containerRegistryName: '$(containerRegistryName)'
              webAppName: '$(webAppName)'
              appName: '$(appName)'

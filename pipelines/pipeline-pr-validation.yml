name: TeamBoard-PR-Validation-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

pr:
  branches:
    include:
      - main
      - master
      - develop

variables:
  pythonVersion: '3.11'

jobs:
  - job: PRValidationJob
    displayName: 'PR Pre-Merge Quality Gate & Automated Tests'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - template: templates/test-steps-template.yml
        parameters:
          pythonVersion: '$(pythonVersion)'
          testRunTitle: 'PR Validation Automated Tests'

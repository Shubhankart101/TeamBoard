name: TeamBoard-Code-Testing-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - '*'
pr:
  branches:
    include:
      - '*'

variables:
  pythonVersion: '3.11'

jobs:
  - job: CodeTestingJob
    displayName: 'Automated Code Testing & Quality Checks'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - template: templates/test-steps-template.yml
        parameters:
          pythonVersion: '$(pythonVersion)'
          testRunTitle: 'TeamBoard API Automated Tests'
